<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>github-enhanced</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        width: 420px;
        margin: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 15px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
      }
      small {
        display: block;
        opacity: 0.7;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 120px;
        margin-top: 4px;
        padding: 6px 8px;
        border: 1px solid #8888;
        border-radius: 6px;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre;
      }
      button {
        margin-top: 12px;
        padding: 5px 16px;
        border: 1px solid #8888;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
      }
      output {
        margin-left: 8px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>github-enhanced</h1>
    <label for="bookmarks">Bookmarks</label>
    <small>One per line: <code>Name | owner/repo</code></small>
    <textarea id="bookmarks" spellcheck="false" placeholder="ZeroStarter | nrjdalal/zerostarter"></textarea>
    <label for="nav">Links under Home and Feed</label>
    <small>One per line: <code>Label | URL | book</code> or <code>book-locked</code></small>
    <textarea id="nav" spellcheck="false" placeholder="Octocat | https://github.com/octocat?tab=repositories | book"></textarea>
    <button id="save">Save</button><output id="status"></output>
    <script src="settings.js"></script>
  </body>
</html>
