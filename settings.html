<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Enhanced</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        width: 480px;
        margin: 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      small {
        display: block;
        opacity: 0.7;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 320px;
        margin-top: 12px;
        padding: 8px 10px;
        border: 1px solid #8888;
        border-radius: 6px;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre;
        tab-size: 2;
      }
      button {
        margin-top: 12px;
        padding: 5px 16px;
        border: 1px solid #8888;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
      }
      output {
        margin-left: 8px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>GitHub Enhanced</h1>
    <small><code>bookmarks</code> maps <code>owner/repo</code> to a name; <code>links</code> maps a URL to <code>[label, "book" | "book-locked"]</code>.</small>
    <textarea id="config" spellcheck="false" aria-label="Config (JSON)"></textarea>
    <button id="save">Save</button><output id="status"></output>
    <script src="settings.js"></script>
  </body>
</html>
